<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KISLAP — Loader</title>
    <style>
        :root {
            --ink: #0b0a0a;
            --paper: #0f0d0d;
            --spark: #fbb040;
            --spark-soft: #f7c76b;
            --glow: #f3e9da;
            --line: #efe7d8;
            --draw-duration: 2600ms;
            --draw-ease: cubic-bezier(.65, .05, .2, 1);
            --settle-duration: 900ms;
            --hold-duration: 1400ms;
            --fade-duration: 700ms;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: radial-gradient(120% 140% at 50% 38%, #1a1616 0%, #100d0d 55%, #0a0808 100%);
            font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
            overflow: hidden;
        }

        .stage {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* faint vignette + grain-less ambient glow behind the mark */
        .aura {
            position: absolute;
            width: min(70vmin, 640px);
            height: min(70vmin, 640px);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(251, 176, 64, 0.16) 0%, rgba(251, 176, 64, 0.05) 38%, rgba(251, 176, 64, 0) 70%);
            filter: blur(2px);
            opacity: 0;
            animation: auraIn 1.4s ease-out forwards;
            animation-delay: calc(var(--draw-duration) * 0.55);
            pointer-events: none;
        }

        @keyframes auraIn {
            to {
                opacity: 1;
                transform: scale(1.04);
            }
        }

        .mark-wrap {
            position: relative;
            width: min(46vmin, 420px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(18px, 3vmin, 30px);
        }

        svg.logo {
            width: 100%;
            height: auto;
            overflow: visible;
            display: block;
        }

        /* ---------- ORNAMENT (the sparkle-lattice) ----------
     Drawn first as a fine calligraphic stroke line, then
     it quietly crossfades into the solid inked mark.        */
        #ornament-stroke {
            fill: none;
            stroke: var(--line);
            stroke-width: 34;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.92;
        }

        #ornament-fill {
            fill: var(--ink);
            stroke: none;
            opacity: 0;
        }

        /* ---------- K LETTERFORM ---------- */
        #k-fill {
            fill: var(--ink);
            opacity: 0;
            transform-origin: 68% 50%;
        }

        /* ---------- SPARK ---------- */
        #spark {
            fill: var(--spark);
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
        }

        /* ============ ANIMATION STATE ============
     A single root class ".is-playing" drives everything so the
     whole piece can be re-triggered by toggling that class (see JS API). */

        .is-playing #ornament-stroke {
            animation:
                draw-line var(--draw-duration) var(--draw-ease) forwards,
                line-out var(--settle-duration) ease-out forwards;
            animation-delay: 0ms, calc(var(--draw-duration) - 120ms);
        }

        .is-playing #ornament-fill {
            animation: fill-in var(--settle-duration) ease-out forwards;
            animation-delay: calc(var(--draw-duration) - 120ms);
        }

        .is-playing #k-fill {
            animation: rise-in 980ms cubic-bezier(.2, .8, .2, 1) forwards;
            animation-delay: calc(var(--draw-duration) + var(--settle-duration) * 0.35);
        }

        .is-playing #spark {
            animation:
                spark-in 640ms cubic-bezier(.34, 1.56, .64, 1) forwards,
                twinkle 2600ms ease-in-out infinite;
            animation-delay:
                calc(var(--draw-duration) + var(--settle-duration) * 0.55),
                calc(var(--draw-duration) + var(--settle-duration) * 0.55 + 640ms);
        }

        @keyframes draw-line {
            from {
                stroke-dashoffset: var(--ornament-len);
            }

            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes line-out {
            to {
                opacity: 0;
            }
        }

        @keyframes fill-in {
            to {
                opacity: 1;
            }
        }

        @keyframes rise-in {
            from {
                opacity: 0;
                transform: translateY(18px) scale(.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes spark-in {
            from {
                opacity: 0;
                transform: scale(.2) rotate(-25deg);
            }

            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .72;
                transform: scale(.88);
            }
        }

        /* idle "still loading" breathing loop, applied by JS after first pass
     when the loader is used in indefinite / looping mode */
        .is-looping .mark-wrap {
            animation: breathe 2600ms ease-in-out infinite;
            animation-delay: calc(var(--draw-duration) + var(--settle-duration) + 900ms);
        }

        @keyframes breathe {

            0%,
            100% {
                filter: none;
            }

            50% {
                filter: drop-shadow(0 0 18px rgba(251, 176, 64, .22));
            }
        }

        .label {
            font-family: 'Cormorant Garamond', Georgia, serif;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            font-size: clamp(11px, 1.6vmin, 13px);
            color: var(--glow);
            opacity: 0;
            text-align: center;
            animation: label-in var(--fade-duration) ease-out forwards;
            animation-delay: calc(var(--draw-duration) + var(--settle-duration) + 300ms);
        }

        @keyframes label-in {
            to {
                opacity: .72;
            }
        }

        .label small {
            display: block;
            margin-top: 6px;
            letter-spacing: 0.28em;
            font-size: 0.72em;
            opacity: .55;
        }

        @media (prefers-reduced-motion: reduce) {

            #ornament-stroke,
            #ornament-fill,
            #k-fill,
            #spark,
            .label,
            .aura,
            .mark-wrap {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
                stroke-dashoffset: 0 !important;
            }

            #ornament-stroke {
                opacity: 0 !important;
            }
        }
    </style>
</head>

    <script>
        (function () {
            var root = document.documentElement;
            var strokePath = document.getElementById('ornament-stroke');

            // Measure the true geometric length of the ornament path so the
            // "draw-on" animation always traces the exact contour, at any size.
            function primeDashLength() {
                var len = strokePath.getTotalLength();
                strokePath.style.strokeDasharray = len;
                strokePath.style.strokeDashoffset = len;
                document.documentElement.style.setProperty('--ornament-len', len);
            }
            primeDashLength();

            /* ---------------- Reusable playback API ----------------
               window.KislapLoader.play()    -> draw once, settle, hold (default autoplay)
               window.KislapLoader.loop()    -> draw once, settle, then idle-breathe forever
               window.KislapLoader.restart() -> replay the full sequence from zero
               window.KislapLoader.seek(ms)  -> jump the CSS timeline to an exact
                                                 millisecond, for frame-accurate video export
            ---------------------------------------------------------- */
            var stage = document.querySelector('.stage');

            function computeTotalMs() {
                var cs = getComputedStyle(root);
                var toMs = function (v) {
                    v = v.trim();
                    return v.endsWith('ms') ? parseFloat(v) : parseFloat(v) * 1000;
                };
                return toMs(cs.getPropertyValue('--draw-duration')) +
                    toMs(cs.getPropertyValue('--settle-duration')) + 900;
            }

            var api = {
                play: function () {
                    stage.classList.remove('is-playing', 'is-looping');
                    void stage.offsetWidth; // restart animations
                    stage.classList.add('is-playing');
                },
                loop: function () {
                    stage.classList.remove('is-playing', 'is-looping');
                    void stage.offsetWidth;
                    stage.classList.add('is-playing', 'is-looping');
                },
                restart: function () { this.loop(); },
                seek: function (ms) {
                    var all = stage.querySelectorAll('*');
                    all.forEach(function (el) {
                        el.getAnimations().forEach(function (a) { a.currentTime = ms; });
                    });
                },
                totalDurationMs: computeTotalMs
            };
            window.KislapLoader = api;

            // Autoplay in looping ("still loading") mode by default.
            requestAnimationFrame(function () { api.loop(); });
        })();
    </script>
